# Start with a list of packages in packages.csv, and get external data about them (e.g. last commit date) to generate an HTML page with the package information. This workflow is triggered manually from the Actions tab.
# Olly Butters
# 9/6/26
name: Package list

# Controls when the workflow will run
on:
  schedule:
    - cron: '30 5 * * *'
      timezone: "Europe/London"
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Parse the package list, get the external data, and write to a new JSON file
      - name: Build package data
        run: |
          echo $GITHUB_WORKSPACE
          ls $GITHUB_WORKSPACE

          python3 source/process_packages.py

          # print the output to the console for debugging
          cat output/metadata/packages.json
          
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Parse the output JSON file and generate HTML pages
      - name: build html page
        run: |
          python3 source/build_packages_summary_page.py
          python3 source/build_packages_long_page.py
          mkdir gh-pages
          mv output/html/* gh-pages/
          mv output/metadata/packages.json gh-pages/

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3 
        with:
          path: gh-pages

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
